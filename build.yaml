overview: "Hide upgraded media from Recently Added."
description: >-
  Detects when a media file is replaced shortly after being removed (for example
  by Sonarr or Radarr downloading an upgraded copy) and preserves the original
  DateCreated so the item does not re-appear in the Recently Added list.
